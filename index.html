<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>词句审判庭</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1C1914;
      --card: #26211A;
      --word: #B94732;
      --real: #CAA765;
      --text: #E8E1D3;
      --muted: #8C8171;
      --border: #3A3227;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 22% 28%, rgba(202, 167, 101, 0.055), transparent 52%),
        radial-gradient(circle at 78% 72%, rgba(185, 71, 50, 0.045), transparent 52%);
      box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.45);
    }
    .box {
      position: relative;
      z-index: 1;
      max-width: 420px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px 28px;
    }
    .eyebrow { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    h1 {
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-size: 26px;
      margin-bottom: 8px;
      color: var(--text);
    }
    p { font-size: 15px; color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
    a {
      display: block;
      text-align: center;
      text-decoration: none;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    a.vote { background: var(--word); }
    a.board { background: var(--real); color: #1C1914; }
    .hint { font-size: 13px; color: var(--muted); margin-top: 16px; line-height: 1.5; margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="box">
    <div class="eyebrow">第 5 组 ·《德意志意识形态》第一章</div>
    <h1>词句审判庭</h1>
    <p>课堂互动：判断句子是「词句」还是「现实」。</p>
    <a class="vote" href="./vote.html">同学答题（扫码进这个）</a>
    <a class="board" href="./board.html">讲者看板（投影打开）</a>
    <p class="hint">
      同学各自答完六道题，再一起看投影总结。<br />
      课堂结束请在看板上点「清空全部数据」。
    </p>
  </div>
</body>
</html>
