<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>词句审判庭 · 看板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1C1914;
      --card: #26211A;
      --word: #B94732;
      --real: #CAA765;
      --text: #E8E1D3;
      --muted: #8C8171;
      --border: #3A3227;
      --emph: #E8E1D3;
      --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", STSong, serif;
      --sans: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(circle at 18% 25%, rgba(202, 167, 101, 0.06), transparent 55%),
        radial-gradient(circle at 82% 78%, rgba(185, 71, 50, 0.05), transparent 55%);
      box-shadow: inset 0 0 110px rgba(0, 0, 0, 0.5);
    }
    #board {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      max-height: 100dvh;
      padding: 12px 20px 10px;
      overflow: hidden;
    }
    .hidden { display: none !important; }

    .top {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
    }

    /* 马克思旁白 */
    .marx-row {
      flex: 0 0 auto;
      display: flex;
      align-items: stretch;
      gap: 12px;
      margin-bottom: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .marx-avatar {
      width: clamp(56px, 8vh, 72px);
      height: clamp(56px, 8vh, 72px);
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--real);
      flex-shrink: 0;
      background: #2E2820;
    }
    .marx-bubble {
      flex: 1;
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .marx-bubble::before {
      content: "";
      position: absolute;
      left: -7px;
      top: 22px;
      width: 12px;
      height: 12px;
      background: var(--card);
      border-left: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      transform: rotate(45deg);
    }
    .marx-name {
      font-size: 12px;
      color: var(--real);
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: 0.04em;
    }
    .marx-text {
      font-family: var(--serif);
      font-size: clamp(14px, 1.8vh, 17px);
      line-height: 1.55;
      color: var(--emph);
    }
    .marx-tag {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
    }
    .top-left { min-width: 0; }
    .brand-line { font-size: 13px; color: var(--muted); }
    .title {
      font-family: var(--serif);
      font-size: clamp(20px, 2.4vw, 26px);
      font-weight: 700;
      color: var(--emph);
      margin-top: 2px;
    }
    .top-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .participants {
      text-align: right;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }
    .participants strong {
      font-size: clamp(26px, 3.8vh, 34px);
      color: var(--emph);
      font-weight: 700;
      display: block;
      line-height: 1.1;
    }
    .qr-corner {
      background: #fff;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.35);
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .qr-corner:hover {
      transform: scale(1.03);
      box-shadow: 0 4px 18px rgba(0,0,0,0.45);
    }
    .qr-corner img {
      display: block;
      width: clamp(140px, 18vh, 200px);
      height: auto;
      pointer-events: none;
    }
    .qr-cap {
      font-size: 13px;
      color: #6B6152;
      text-align: center;
      margin-top: 6px;
      letter-spacing: 0.02em;
      font-weight: 600;
      pointer-events: none;
    }

    /* 大二维码弹层 */
    .qr-modal {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(12, 10, 8, 0.82);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: qrFadeIn 0.2s ease;
    }
    .qr-modal.closing { animation: qrFadeOut 0.18s ease forwards; }
    @keyframes qrFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes qrFadeOut { from { opacity: 1; } to { opacity: 0; } }
    .qr-modal-box {
      background: #fff;
      border-radius: 16px;
      padding: 28px 28px 20px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
      animation: qrPop 0.22s ease;
    }
    @keyframes qrPop {
      from { transform: scale(0.92); opacity: 0.7; }
      to { transform: scale(1); opacity: 1; }
    }
    .qr-modal-box img {
      display: block;
      width: min(420px, 70vw, 70vh);
      height: auto;
      margin: 0 auto;
    }
    .qr-modal-title {
      margin-top: 14px;
      font-size: 20px;
      font-weight: 700;
      color: #1C1914;
      font-family: var(--sans);
    }
    .qr-modal-hint {
      margin-top: 6px;
      font-size: 14px;
      color: #6B6152;
    }
    .qr-modal-close {
      margin-top: 16px;
      min-height: 44px;
      padding: 0 28px;
      border: none;
      border-radius: 8px;
      background: #B94732;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .status-row {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .status-dot {
      display: inline-block;
      width: 8px; height: 8px; border-radius: 50%;
      background: #6A9A5A;
    }
    .status-dot.err { background: var(--word); }

    .q-nav {
      flex: 0 0 auto;
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      margin-bottom: 8px;
      align-items: center;
    }
    .q-nav button {
      min-width: 40px; height: 34px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--text); font-size: 14px; cursor: pointer;
      font-family: var(--sans); padding: 0 10px;
    }
    .q-nav button.active {
      background: var(--word); border-color: var(--word);
      color: #fff; font-weight: 700;
    }
    .q-nav button.overview-btn {
      min-width: 56px;
      font-weight: 600;
    }
    .q-nav button.overview-btn.active {
      background: var(--real);
      border-color: var(--real);
      color: #1C1914;
    }

    .main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    /* ===== 总览 ===== */
    #viewOverview {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      gap: 10px;
    }
    .overview-head {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }
    .overview-head h2 {
      font-family: var(--serif);
      font-size: clamp(18px, 2.2vh, 24px);
      color: var(--emph);
    }
    .overview-head .avg {
      font-size: clamp(16px, 2.2vh, 22px);
      color: var(--real);
      font-weight: 700;
    }
    .ov-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 10px;
      min-height: 0;
    }
    .ov-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .ov-card:hover { border-color: var(--real); }
    .ov-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      flex: 0 0 auto;
    }
    .ov-q {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
    }
    .ov-ans {
      font-size: 12px;
      color: var(--muted);
    }
    .ov-ans.word { color: var(--word); }
    .ov-ans.real { color: var(--real); }
    .ov-pct {
      font-size: clamp(28px, 5.5vh, 48px);
      font-weight: 700;
      line-height: 1.05;
      color: var(--emph);
      margin-bottom: 4px;
      flex: 0 0 auto;
    }
    .ov-meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
      flex: 0 0 auto;
    }
    .ov-bar {
      margin-top: auto;
      height: 8px;
      border-radius: 4px;
      background: var(--border);
      overflow: hidden;
      display: flex;
      flex: 0 0 auto;
    }
    .ov-bar .w { background: var(--word); height: 100%; }
    .ov-bar .r { background: var(--real); height: 100%; }
    .ov-split {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      flex: 0 0 auto;
    }

    /* ===== 单题 ===== */
    #viewDetail {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .stem {
      flex: 0 0 auto;
      font-family: var(--serif);
      font-size: clamp(22px, 3.2vh, 40px);
      font-weight: 700;
      line-height: 1.35;
      color: var(--emph);
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .source {
      flex: 0 0 auto;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .bars {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      flex: 1 1 auto;
      align-items: stretch;
      min-height: 0;
    }
    .col {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
    }
    .col-label { flex: 0 0 auto; font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .col.word .col-label { color: var(--word); }
    .col.real .col-label { color: var(--real); }
    .count {
      flex: 0 0 auto;
      font-size: clamp(48px, 9vh, 88px);
      font-weight: 700;
      line-height: 1;
      color: var(--emph);
      margin-bottom: 8px;
    }
    .track {
      flex: 1 1 auto;
      background: var(--border);
      border-radius: 8px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      min-height: 36px;
    }
    .fill {
      width: 100%;
      height: 0%;
      border-radius: 8px 8px 0 0;
      transition: height 0.3s ease;
    }
    .col.word .fill { background: var(--word); }
    .col.real .fill { background: var(--real); }

    .reveal-panel {
      flex: 0 0 auto;
      margin-top: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      text-align: center;
      display: none;
    }
    .reveal-panel.show { display: block; }
    .reveal-answer {
      font-family: var(--serif);
      font-size: clamp(18px, 2.4vh, 24px);
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--emph);
    }
    .reveal-rate {
      font-size: clamp(22px, 3.5vh, 34px);
      font-weight: 700;
      color: var(--emph);
    }
    .reveal-rate span { color: var(--muted); font-size: 16px; font-weight: 500; }

    .dock {
      flex: 0 0 auto;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }
    .ctrl {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .ctrl button, .manual button {
      background: #2E2820;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-family: var(--sans);
    }
    .ctrl button:hover { background: #3A3227; }
    .ctrl .danger { background: #4A2820; color: #F0D0C8; border-color: #6A3830; }
    .ctrl .accent { background: var(--real); color: #1C1914; border-color: var(--real); font-weight: 600; }
    .ctrl .primary { background: var(--word); color: #fff; border-color: var(--word); }
    .footer {
      text-align: center;
      font-size: 12px;
      color: #6B6152;
      padding-top: 6px;
    }
    .manual {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-top: 8px;
      display: none;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .manual.show { display: flex; }
    .manual label { font-size: 13px; color: var(--muted); }
    .manual input {
      width: 64px;
      background: #1C1914;
      border: 1px solid var(--border);
      color: var(--emph);
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 14px;
    }
    .cfg-warn {
      flex: 0 0 auto;
      background: #3A2A20;
      color: #E8C090;
      border: 1px solid #5A4030;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    @media (max-width: 900px) {
      .ov-grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div id="board">
    <div id="cfgWarn" class="cfg-warn" style="display:none">
      尚未配置或无法连接。请确认 common.js 与 schema.sql。
    </div>

    <div class="top">
      <div class="top-left">
        <div class="brand-line">第 5 组 ·《德意志意识形态》第一章</div>
        <div class="title">词句审判庭 · 答题情况</div>
      </div>
      <div class="top-right">
        <div class="participants">
          已参与
          <strong id="partCount" data-value="0">0</strong>
          人
        </div>
        <div class="qr-corner" id="qrCorner" title="点击放大" role="button" tabindex="0">
          <img src="./qr-vote.png" alt="扫码答题" width="200" height="200" />
          <div class="qr-cap">点击放大</div>
        </div>
      </div>
    </div>

    <div class="marx-row" id="marxRow">
      <img class="marx-avatar" src="./marx-portrait.jpg" alt="马克思" width="72" height="72" />
      <div class="marx-bubble">
        <div class="marx-name">马克思旁白</div>
        <div class="marx-text" id="marxText">人还没齐呢。等大家扫码答完，我再开口。不着急。</div>
        <div class="marx-tag" id="marxTag">总览 · 尚无数据</div>
      </div>
    </div>

    <div id="qrModal" class="qr-modal hidden" role="dialog" aria-modal="true" aria-label="扫码答题">
      <div class="qr-modal-box" id="qrModalBox">
        <img src="./qr-vote.png" alt="扫码答题大图" width="420" height="420" />
        <div class="qr-modal-title">扫码答题</div>
        <div class="qr-modal-hint">用手机扫描此码进入投票页</div>
        <button type="button" class="qr-modal-close" id="qrModalClose">关闭</button>
      </div>
    </div>

    <div class="status-row">
      <span class="status-dot" id="dot"></span>
      <span id="pollStatus">票数每 2 秒刷新</span>
    </div>

    <div class="q-nav" id="qNav">
      <button type="button" class="overview-btn active" id="btnOverview" data-view="overview">总览</button>
    </div>

    <div class="main">
      <!-- 六道正确率总览 -->
      <div id="viewOverview">
        <div class="overview-head">
          <h2>六道题正确率总览</h2>
          <div class="avg">平均正确率 <span id="avgPct">—</span></div>
        </div>
        <div class="ov-grid" id="ovGrid"></div>
      </div>

      <!-- 单题详情 -->
      <div id="viewDetail" class="hidden">
        <div class="stem" id="stem"></div>
        <div class="source" id="source"></div>
        <div class="bars">
          <div class="col word">
            <div class="col-label">词句</div>
            <div class="count" id="wordCount" data-value="0">0</div>
            <div class="track"><div class="fill" id="wordFill"></div></div>
          </div>
          <div class="col real">
            <div class="col-label">现实</div>
            <div class="count" id="realCount" data-value="0">0</div>
            <div class="track"><div class="fill" id="realFill"></div></div>
          </div>
        </div>
        <div class="reveal-panel" id="revealPanel">
          <div class="reveal-answer" id="revealAnswer"></div>
          <div class="reveal-rate" id="revealRate"></div>
        </div>
      </div>
    </div>

    <div class="dock">
      <div class="ctrl">
        <button type="button" class="primary" id="btnToOverview">← 返回总览</button>
        <button type="button" id="btnPrev">上一题</button>
        <button type="button" id="btnNext">下一题</button>
        <button type="button" class="accent" id="btnReveal">揭晓</button>
        <button type="button" id="btnHideReveal">收起揭晓</button>
        <button type="button" id="btnManual">手动补票 ▾</button>
        <button type="button" class="danger" id="btnClear">清空全部数据</button>
      </div>
      <div class="manual" id="manualPanel">
        <label>词句票数</label>
        <input id="manualWord" type="number" min="0" value="0" />
        <label>现实票数</label>
        <input id="manualReal" type="number" min="0" value="0" />
        <button type="button" id="manualApply">填入（覆盖本题统计）</button>
        <span style="font-size:12px;color:var(--muted)">举手统计兜底</span>
      </div>
      <div class="footer">第 5 组 ·《德意志意识形态》第一章 · 扫右上角码答题</div>
    </div>
  </div>

  <script type="module">
    import {
      QUESTIONS,
      LABEL,
      ANSWERS,
      isConfigured,
      fetchVotes as apiFetchVotes,
      clearVotes,
      replaceQuestionVotes,
      tallyVotes,
      participantCount,
      animateNumber,
    } from './common.js';
    import { marxSay, tierName } from './marx-comments.js';

    const el = (id) => document.getElementById(id);
    let currentQ = 1;
    let votesCache = [];
    let revealed = false;
    let view = 'overview'; // overview | detail
    let ready = false;

    const qNav = el('qNav');
    QUESTIONS.forEach((q) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = String(q.q);
      b.dataset.q = String(q.q);
      b.addEventListener('click', () => showDetail(q.q));
      qNav.appendChild(b);
    });

    // 预建总览卡片
    const ovGrid = el('ovGrid');
    QUESTIONS.forEach((q) => {
      const card = document.createElement('div');
      card.className = 'ov-card';
      card.dataset.q = String(q.q);
      card.innerHTML =
        `<div class="ov-top">` +
        `<span class="ov-q">第 ${q.q} 题</span>` +
        `<span class="ov-ans ${ANSWERS[q.q]}" id="ovAns${q.q}">答案 · ${LABEL[ANSWERS[q.q]]}</span>` +
        `</div>` +
        `<div class="ov-pct" id="ovPct${q.q}">—</div>` +
        `<div class="ov-meta" id="ovMeta${q.q}">暂无投票</div>` +
        `<div class="ov-bar"><div class="w" id="ovW${q.q}" style="width:0%"></div>` +
        `<div class="r" id="ovR${q.q}" style="width:0%"></div></div>` +
        `<div class="ov-split"><span id="ovWord${q.q}">词句 0</span><span id="ovReal${q.q}">现实 0</span></div>`;
      card.addEventListener('click', () => showDetail(q.q));
      ovGrid.appendChild(card);
    });

    function setNavActive() {
      el('btnOverview').classList.toggle('active', view === 'overview');
      qNav.querySelectorAll('button[data-q]').forEach((b) => {
        b.classList.toggle('active', view === 'detail' && Number(b.dataset.q) === currentQ);
      });
    }

    function showOverview() {
      view = 'overview';
      revealed = false;
      el('revealPanel').classList.remove('show');
      el('viewOverview').classList.remove('hidden');
      el('viewDetail').classList.add('hidden');
      el('btnToOverview').classList.add('hidden');
      el('btnPrev').classList.add('hidden');
      el('btnNext').classList.add('hidden');
      el('btnReveal').classList.add('hidden');
      el('btnHideReveal').classList.add('hidden');
      el('btnManual').classList.add('hidden');
      el('manualPanel').classList.remove('show');
      setNavActive();
      renderOverview();
    }

    function showDetail(q) {
      view = 'detail';
      currentQ = q;
      revealed = false;
      el('revealPanel').classList.remove('show');
      el('viewOverview').classList.add('hidden');
      el('viewDetail').classList.remove('hidden');
      el('btnToOverview').classList.remove('hidden');
      el('btnPrev').classList.remove('hidden');
      el('btnNext').classList.remove('hidden');
      el('btnReveal').classList.remove('hidden');
      el('btnHideReveal').classList.remove('hidden');
      el('btnManual').classList.remove('hidden');
      const item = QUESTIONS.find((x) => x.q === currentQ);
      el('stem').textContent = item.text;
      el('source').textContent = '出处：' + item.source;
      setNavActive();
      renderDetail();
    }

    function qStats(q) {
      const { word, real, total } = tallyVotes(votesCache, q);
      const ans = ANSWERS[q];
      const correct = ans === 'word' ? word : real;
      const pct = total ? Math.round((correct / total) * 100) : null;
      return { word, real, total, correct, pct, ans };
    }

    function updateMarx(mode, pct, q) {
      const text = marxSay(mode, pct, q);
      const node = el('marxText');
      if (node.textContent !== text) {
        node.style.opacity = '0.35';
        setTimeout(() => {
          node.textContent = text;
          node.style.opacity = '1';
        }, 120);
      }
      node.style.transition = 'opacity 0.2s ease';
      if (mode === 'overview') {
        el('marxTag').textContent =
          '总览 · ' + (pct == null ? '尚无数据' : '平均正确率 ' + pct + '% · ' + tierName(pct));
      } else {
        el('marxTag').textContent =
          '第 ' + q + ' 题 · ' + (pct == null ? '尚无数据' : '正确率 ' + pct + '% · ' + tierName(pct));
      }
    }

    function renderOverview() {
      let sumPct = 0;
      let counted = 0;
      QUESTIONS.forEach((q) => {
        const s = qStats(q.q);
        const pctEl = el('ovPct' + q.q);
        const metaEl = el('ovMeta' + q.q);
        if (s.total === 0) {
          pctEl.textContent = '—';
          metaEl.textContent = '暂无投票';
        } else {
          pctEl.textContent = s.pct + '%';
          metaEl.textContent = `判对 ${s.correct} / ${s.total} 人`;
          sumPct += s.pct;
          counted += 1;
        }
        const wPct = s.total ? Math.round((s.word / s.total) * 100) : 0;
        const rPct = s.total ? 100 - wPct : 0;
        el('ovW' + q.q).style.width = wPct + '%';
        el('ovR' + q.q).style.width = rPct + '%';
        el('ovWord' + q.q).textContent = '词句 ' + s.word;
        el('ovReal' + q.q).textContent = '现实 ' + s.real;
      });
      const avg = counted ? Math.round(sumPct / counted) : null;
      el('avgPct').textContent = avg == null ? '—' : avg + '%';
      animateNumber(el('partCount'), participantCount(votesCache));
      updateMarx('overview', avg);
    }

    function renderDetail() {
      const { word, real } = tallyVotes(votesCache, currentQ);
      const parts = participantCount(votesCache);
      animateNumber(el('wordCount'), word);
      animateNumber(el('realCount'), real);
      animateNumber(el('partCount'), parts);
      const max = Math.max(word, real, 1);
      el('wordFill').style.height = Math.round((word / max) * 100) + '%';
      el('realFill').style.height = Math.round((real / max) * 100) + '%';
      const s = qStats(currentQ);
      updateMarx('detail', s.pct, currentQ);
      if (revealed) showReveal();
    }

    function showReveal() {
      const s = qStats(currentQ);
      el('revealAnswer').textContent = '正确答案：' + LABEL[s.ans];
      el('revealRate').innerHTML =
        `本轮判对 ${s.correct} / ${s.total} 人（${s.pct == null ? '—' : s.pct + '%'}）` +
        `<br><span>词句 ${s.word} · 现实 ${s.real}</span>`;
      el('revealPanel').classList.add('show');
      revealed = true;
    }

    async function fetchVotes() {
      if (!ready) return;
      try {
        votesCache = await apiFetchVotes();
        el('dot').classList.remove('err');
        el('pollStatus').textContent =
          '票数每 2 秒刷新 · ' + new Date().toLocaleTimeString();
        if (view === 'overview') renderOverview();
        else renderDetail();
      } catch (e) {
        el('dot').classList.add('err');
        el('pollStatus').textContent = '读取票数失败，请刷新页面';
        console.error(e);
      }
    }

    function openQrModal() {
      el('qrModal').classList.remove('hidden', 'closing');
    }
    function closeQrModal() {
      const m = el('qrModal');
      if (m.classList.contains('hidden')) return;
      m.classList.add('closing');
      setTimeout(() => {
        m.classList.add('hidden');
        m.classList.remove('closing');
      }, 160);
    }
    el('qrCorner').addEventListener('click', openQrModal);
    el('qrCorner').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openQrModal();
      }
    });
    el('qrModalClose').addEventListener('click', closeQrModal);
    el('qrModal').addEventListener('click', (e) => {
      if (e.target === el('qrModal')) closeQrModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeQrModal();
    });

    el('btnOverview').addEventListener('click', showOverview);
    el('btnToOverview').addEventListener('click', showOverview);
    el('btnPrev').addEventListener('click', () => {
      showDetail(currentQ <= 1 ? 6 : currentQ - 1);
    });
    el('btnNext').addEventListener('click', () => {
      showDetail(currentQ >= 6 ? 1 : currentQ + 1);
    });
    el('btnReveal').addEventListener('click', showReveal);
    el('btnHideReveal').addEventListener('click', () => {
      revealed = false;
      el('revealPanel').classList.remove('show');
    });

    el('btnManual').addEventListener('click', () => {
      el('manualPanel').classList.toggle('show');
      const { word, real } = tallyVotes(votesCache, currentQ);
      el('manualWord').value = word;
      el('manualReal').value = real;
    });

    el('manualApply').addEventListener('click', async () => {
      if (!ready) return alert('未配置数据库');
      const w = Math.max(0, parseInt(el('manualWord').value, 10) || 0);
      const r = Math.max(0, parseInt(el('manualReal').value, 10) || 0);
      if (!confirm(`将第 ${currentQ} 题票数覆盖为：词句 ${w} / 现实 ${r}？`)) return;
      try {
        await replaceQuestionVotes(currentQ, w, r);
        await fetchVotes();
        alert('已填入');
      } catch (e) {
        alert('填入失败：' + (e.message || e));
      }
    });

    el('btnClear').addEventListener('click', async () => {
      if (!ready) return alert('未配置数据库');
      if (!confirm('确认清空全部投票数据？')) return;
      if (!confirm('再次确认：清空后不可恢复。')) return;
      try {
        await clearVotes();
        revealed = false;
        el('revealPanel').classList.remove('show');
        await fetchVotes();
      } catch (e) {
        alert('清空失败：' + (e.message || e));
      }
    });

    async function boot() {
      showOverview();
      if (!isConfigured()) {
        el('cfgWarn').style.display = 'block';
        el('dot').classList.add('err');
        ready = false;
        return;
      }
      ready = true;
      await fetchVotes();
      setInterval(fetchVotes, 2000);
    }

    boot();
  </script>
</body>
</html>
