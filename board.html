<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>词句审判庭 · 看板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1C1914;
      --card: #26211A;
      --word: #B94732;
      --real: #CAA765;
      --text: #E8E1D3;
      --muted: #8C8171;
      --border: #3A3227;
      --emph: #E8E1D3;
      --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", STSong, serif;
      --sans: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(circle at 18% 25%, rgba(202, 167, 101, 0.06), transparent 55%),
        radial-gradient(circle at 82% 78%, rgba(185, 71, 50, 0.05), transparent 55%);
      box-shadow: inset 0 0 110px rgba(0, 0, 0, 0.5);
    }
    .screen { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .hidden { display: none !important; }

    /* ===== 首页：二维码 ===== */
    #landing {
      align-items: center;
      justify-content: center;
      padding: 40px 28px 32px;
      text-align: center;
    }
    .land-eyebrow {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 10px;
      letter-spacing: 0.04em;
    }
    .land-title {
      font-family: var(--serif);
      font-size: clamp(36px, 5vw, 56px);
      font-weight: 700;
      color: var(--emph);
      margin-bottom: 12px;
    }
    .land-sub {
      font-size: 18px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .qr-wrap {
      background: #fff;
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
      margin-bottom: 16px;
    }
    .qr-wrap img {
      display: block;
      width: min(320px, 55vw);
      height: auto;
    }
    .qr-hint {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.55;
    }
    .qr-hint code {
      font-size: 13px;
      color: var(--real);
      word-break: break-all;
    }
    .land-live {
      font-size: 20px;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .land-live strong {
      font-size: 40px;
      color: var(--emph);
      font-weight: 700;
      margin: 0 6px;
    }
    .btn-go {
      min-height: 56px;
      padding: 0 36px;
      font-size: 20px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      background: var(--word);
      color: #fff;
      cursor: pointer;
      font-family: var(--sans);
    }
    .btn-go:hover { filter: brightness(1.08); }

    /* ===== 结果页：一屏装下，底栏不被裁切 ===== */
    #results {
      padding: 12px 24px 10px;
      height: 100%;
      max-height: 100dvh;
      overflow: hidden;
    }
    .top {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .brand-line { font-size: 13px; color: var(--muted); }
    .title {
      font-family: var(--serif);
      font-size: clamp(20px, 2.4vw, 26px);
      font-weight: 700;
      color: var(--emph);
      margin-top: 2px;
    }
    .participants {
      text-align: right;
      font-size: 14px;
      color: var(--muted);
      white-space: nowrap;
    }
    .participants strong {
      font-size: clamp(28px, 4vh, 36px);
      color: var(--emph);
      font-weight: 700;
      display: block;
      line-height: 1.1;
    }

    .status-row {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .status-dot {
      display: inline-block;
      width: 8px; height: 8px; border-radius: 50%;
      background: #6A9A5A;
    }
    .status-dot.err { background: var(--word); }

    .q-nav {
      flex: 0 0 auto;
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      margin-bottom: 8px;
    }
    .q-nav button {
      min-width: 40px; height: 34px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--text); font-size: 15px; cursor: pointer;
      font-family: var(--sans);
    }
    .q-nav button.active {
      background: var(--word); border-color: var(--word);
      color: #fff; font-weight: 700;
    }

    .main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .stem {
      flex: 0 0 auto;
      font-family: var(--serif);
      font-size: clamp(22px, 3.2vh, 40px);
      font-weight: 700;
      line-height: 1.35;
      color: var(--emph);
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .source {
      flex: 0 0 auto;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .bars {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      flex: 1 1 auto;
      align-items: stretch;
      min-height: 0;
    }
    .col {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
    }
    .col-label { flex: 0 0 auto; font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .col.word .col-label { color: var(--word); }
    .col.real .col-label { color: var(--real); }
    .count {
      flex: 0 0 auto;
      font-size: clamp(48px, 9vh, 88px);
      font-weight: 700;
      line-height: 1;
      color: var(--emph);
      margin-bottom: 8px;
    }
    .track {
      flex: 1 1 auto;
      background: var(--border);
      border-radius: 8px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      min-height: 36px;
    }
    .fill {
      width: 100%;
      height: 0%;
      border-radius: 8px 8px 0 0;
      transition: height 0.3s ease;
    }
    .col.word .fill { background: var(--word); }
    .col.real .fill { background: var(--real); }

    .reveal-panel {
      flex: 0 0 auto;
      margin-top: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      text-align: center;
      display: none;
    }
    .reveal-panel.show { display: block; }
    .reveal-answer {
      font-family: var(--serif);
      font-size: clamp(18px, 2.4vh, 24px);
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--emph);
    }
    .reveal-rate {
      font-size: clamp(22px, 3.5vh, 34px);
      font-weight: 700;
      color: var(--emph);
    }
    .reveal-rate span { color: var(--muted); font-size: 16px; font-weight: 500; }

    /* 底栏固定在屏幕内，不被 overflow 裁掉 */
    .dock {
      flex: 0 0 auto;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }
    .ctrl {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .ctrl button, .manual button {
      background: #2E2820;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-family: var(--sans);
    }
    .ctrl button:hover { background: #3A3227; }
    .ctrl .danger { background: #4A2820; color: #F0D0C8; border-color: #6A3830; }
    .ctrl .accent { background: var(--real); color: #1C1914; border-color: var(--real); font-weight: 600; }
    .ctrl .primary { background: var(--word); color: #fff; border-color: var(--word); }
    .footer {
      text-align: center;
      font-size: 12px;
      color: #6B6152;
      padding-top: 6px;
    }
    .manual {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-top: 8px;
      display: none;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .manual.show { display: flex; }
    .manual label { font-size: 13px; color: var(--muted); }
    .manual input {
      width: 64px;
      background: #1C1914;
      border: 1px solid var(--border);
      color: var(--emph);
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 14px;
    }
    .cfg-warn {
      flex: 0 0 auto;
      background: #3A2A20;
      color: #E8C090;
      border: 1px solid #5A4030;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <!-- 首页：二维码 -->
  <div id="landing" class="screen">
    <div class="land-eyebrow">第 5 组 ·《德意志意识形态》第一章</div>
    <h1 class="land-title">词句审判庭</h1>
    <p class="land-sub">请用手机扫描下方二维码答题<br />答完后抬头看投影，一起总结</p>
    <div class="qr-wrap">
      <img src="./qr-vote.png" alt="扫码答题二维码" width="320" height="320" />
    </div>
    <p class="qr-hint">连不上？手机浏览器打开<br /><code id="voteUrlText"></code></p>
    <div class="land-live">已有 <strong id="landPart" data-value="0">0</strong> 人参与</div>
    <p class="qr-hint" style="margin-top:-12px;margin-bottom:22px">同一手机重复提交不会加票（只覆盖）· 票数在下一页</p>
    <button type="button" class="btn-go" id="btnToResults">进入答题情况 →</button>
  </div>

  <!-- 结果页 -->
  <div id="results" class="screen hidden">
    <div id="cfgWarn" class="cfg-warn" style="display:none">
      尚未配置或无法连接。请确认 common.js 与 schema.sql。
    </div>

    <div class="top">
      <div>
        <div class="brand-line">第 5 组 ·《德意志意识形态》第一章</div>
        <div class="title">词句审判庭 · 答题情况</div>
      </div>
      <div class="participants">
        已参与
        <strong id="partCount" data-value="0">0</strong>
        人
      </div>
    </div>

    <div class="status-row">
      <span class="status-dot" id="dot"></span>
      <span id="pollStatus">票数每 2 秒刷新</span>
    </div>

    <div class="q-nav" id="qNav"></div>

    <div class="main">
      <div class="stem" id="stem"></div>
      <div class="source" id="source"></div>

      <div class="bars">
        <div class="col word">
          <div class="col-label">词句</div>
          <div class="count" id="wordCount" data-value="0">0</div>
          <div class="track"><div class="fill" id="wordFill"></div></div>
        </div>
        <div class="col real">
          <div class="col-label">现实</div>
          <div class="count" id="realCount" data-value="0">0</div>
          <div class="track"><div class="fill" id="realFill"></div></div>
        </div>
      </div>

      <div class="reveal-panel" id="revealPanel">
        <div class="reveal-answer" id="revealAnswer"></div>
        <div class="reveal-rate" id="revealRate"></div>
      </div>
    </div>

    <div class="dock">
      <div class="ctrl">
        <button type="button" class="primary" id="btnBackQr">← 返回二维码</button>
        <button type="button" id="btnPrev">上一题</button>
        <button type="button" id="btnNext">下一题</button>
        <button type="button" class="accent" id="btnReveal">揭晓</button>
        <button type="button" id="btnHideReveal">收起揭晓</button>
        <button type="button" id="btnManual">手动补票 ▾</button>
        <button type="button" class="danger" id="btnClear">清空全部数据</button>
      </div>
      <div class="manual" id="manualPanel">
        <label>词句票数</label>
        <input id="manualWord" type="number" min="0" value="0" />
        <label>现实票数</label>
        <input id="manualReal" type="number" min="0" value="0" />
        <button type="button" id="manualApply">填入（覆盖本题统计）</button>
        <span style="font-size:12px;color:var(--muted)">举手统计兜底</span>
      </div>
      <div class="footer">第 5 组 ·《德意志意识形态》第一章 · 大家答完后一起总结</div>
    </div>
  </div>

  <script type="module">
    import {
      QUESTIONS,
      LABEL,
      ANSWERS,
      VOTE_URL,
      isConfigured,
      fetchVotes as apiFetchVotes,
      clearVotes,
      replaceQuestionVotes,
      tallyVotes,
      participantCount,
      animateNumber,
    } from './common.js';

    const el = (id) => document.getElementById(id);
    let currentQ = 1;
    let votesCache = [];
    let revealed = false;
    let onResults = false;
    let ready = false;

    el('voteUrlText').textContent = VOTE_URL;

    function showScreen(name) {
      onResults = name === 'results';
      el('landing').classList.toggle('hidden', name !== 'landing');
      el('results').classList.toggle('hidden', name !== 'results');
    }

    el('btnToResults').addEventListener('click', () => showScreen('results'));
    el('btnBackQr').addEventListener('click', () => showScreen('landing'));

    const qNav = el('qNav');
    QUESTIONS.forEach((q) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = String(q.q);
      b.dataset.q = String(q.q);
      b.addEventListener('click', () => setQuestion(q.q));
      qNav.appendChild(b);
    });

    function setQuestion(q) {
      currentQ = q;
      revealed = false;
      el('revealPanel').classList.remove('show');
      qNav.querySelectorAll('button').forEach((b) => {
        b.classList.toggle('active', Number(b.dataset.q) === currentQ);
      });
      const item = QUESTIONS.find((x) => x.q === currentQ);
      el('stem').textContent = item.text;
      el('source').textContent = '出处：' + item.source;
      renderBars();
    }

    function renderBars() {
      const { word, real } = tallyVotes(votesCache, currentQ);
      const parts = participantCount(votesCache);
      animateNumber(el('wordCount'), word);
      animateNumber(el('realCount'), real);
      animateNumber(el('partCount'), parts);
      animateNumber(el('landPart'), parts);

      const max = Math.max(word, real, 1);
      el('wordFill').style.height = Math.round((word / max) * 100) + '%';
      el('realFill').style.height = Math.round((real / max) * 100) + '%';
    }

    function showReveal() {
      const ans = ANSWERS[currentQ];
      const { word, real, total } = tallyVotes(votesCache, currentQ);
      const correct = ans === 'word' ? word : real;
      const pct = total ? Math.round((correct / total) * 100) : 0;
      el('revealAnswer').textContent = '正确答案：' + LABEL[ans];
      el('revealRate').innerHTML =
        `本轮判对 ${correct} / ${total} 人（${pct}%）` +
        `<br><span>词句 ${word} · 现实 ${real}</span>`;
      el('revealPanel').classList.add('show');
      revealed = true;
    }

    async function fetchVotes() {
      if (!ready) return;
      try {
        votesCache = await apiFetchVotes();
        el('dot').classList.remove('err');
        el('pollStatus').textContent =
          '票数每 2 秒刷新 · ' + new Date().toLocaleTimeString();
        renderBars();
        if (revealed && onResults) showReveal();
      } catch (e) {
        el('dot').classList.add('err');
        el('pollStatus').textContent = '读取票数失败，请刷新页面';
        console.error(e);
      }
    }

    el('btnPrev').addEventListener('click', () => {
      setQuestion(currentQ <= 1 ? 6 : currentQ - 1);
    });
    el('btnNext').addEventListener('click', () => {
      setQuestion(currentQ >= 6 ? 1 : currentQ + 1);
    });
    el('btnReveal').addEventListener('click', showReveal);
    el('btnHideReveal').addEventListener('click', () => {
      revealed = false;
      el('revealPanel').classList.remove('show');
    });

    el('btnManual').addEventListener('click', () => {
      el('manualPanel').classList.toggle('show');
      const { word, real } = tallyVotes(votesCache, currentQ);
      el('manualWord').value = word;
      el('manualReal').value = real;
    });

    el('manualApply').addEventListener('click', async () => {
      if (!ready) return alert('未配置数据库');
      const w = Math.max(0, parseInt(el('manualWord').value, 10) || 0);
      const r = Math.max(0, parseInt(el('manualReal').value, 10) || 0);
      if (!confirm(`将第 ${currentQ} 题票数覆盖为：词句 ${w} / 现实 ${r}？`)) return;

      try {
        await replaceQuestionVotes(currentQ, w, r);
        await fetchVotes();
        alert('已填入');
      } catch (e) {
        console.error(e);
        alert('填入失败：' + (e.message || e));
      }
    });

    el('btnClear').addEventListener('click', async () => {
      if (!ready) return alert('未配置数据库');
      if (!confirm('确认清空全部投票数据？')) return;
      if (!confirm('再次确认：清空后不可恢复。')) return;
      try {
        await clearVotes();
        revealed = false;
        el('revealPanel').classList.remove('show');
        await fetchVotes();
      } catch (e) {
        alert('清空失败：' + (e.message || e));
      }
    });

    async function boot() {
      setQuestion(1);
      showScreen('landing');
      if (!isConfigured()) {
        el('cfgWarn').style.display = 'block';
        el('dot').classList.add('err');
        ready = false;
        return;
      }
      ready = true;
      await fetchVotes();
      setInterval(fetchVotes, 2000);
    }

    boot();
  </script>
</body>
</html>
