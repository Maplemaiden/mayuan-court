<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>词句审判庭 · 看板</title>
  <style>
    :root {
      --bg: #12161C;
      --card: #1C232C;
      --word: #A02A34;
      --real: #96702E;
      --text: #E8ECF2;
      --muted: #8B93A1;
      --emph: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      padding: 20px 28px 12px;
      min-height: 100vh;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 12px;
    }
    .brand-line { font-size: 15px; color: var(--muted); }
    .title {
      font-size: 28px;
      font-weight: 700;
      color: var(--emph);
      margin-top: 4px;
    }
    .participants {
      text-align: right;
      font-size: 18px;
      color: var(--muted);
      white-space: nowrap;
    }
    .participants strong {
      font-size: 36px;
      color: var(--emph);
      font-weight: 700;
      display: block;
      line-height: 1.1;
    }

    .session-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .session-bar input {
      background: var(--card);
      border: 1px solid #2a3340;
      color: var(--emph);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
    }
    .session-bar button, .ctrl button, .manual button {
      background: #2a3340;
      border: none;
      color: var(--text);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .session-bar button:hover, .ctrl button:hover { background: #3a4558; }
    .session-bar button.primary { background: var(--word); color: #fff; }

    .q-nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .q-nav button {
      min-width: 48px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid #2a3340;
      background: var(--card);
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
    }
    .q-nav button.active {
      background: var(--word);
      border-color: var(--word);
      color: #fff;
      font-weight: 700;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .stem {
      font-size: clamp(28px, 3.6vw, 48px);
      font-weight: 700;
      line-height: 1.35;
      color: var(--emph);
      margin-bottom: 8px;
    }
    .source {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .bars {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      flex: 1;
      align-items: end;
      min-height: 220px;
    }
    .col {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 200px;
    }
    .col-label {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .col.word .col-label { color: var(--word); }
    .col.real .col-label { color: var(--real); }
    .count {
      font-size: 96px;
      font-weight: 800;
      line-height: 1;
      color: var(--emph);
      margin-bottom: 12px;
    }
    .track {
      flex: 1;
      background: #0c0f14;
      border-radius: 8px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      min-height: 80px;
    }
    .fill {
      width: 100%;
      height: 0%;
      border-radius: 8px 8px 0 0;
      transition: height 0.3s ease;
    }
    .col.word .fill { background: var(--word); }
    .col.real .fill { background: var(--real); }

    .reveal-panel {
      margin-top: 20px;
      background: var(--card);
      border-radius: 12px;
      padding: 20px 24px;
      text-align: center;
      display: none;
    }
    .reveal-panel.show { display: block; }
    .reveal-answer {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .reveal-rate {
      font-size: 42px;
      font-weight: 800;
      color: var(--emph);
    }
    .reveal-rate span { color: var(--muted); font-size: 22px; font-weight: 500; }

    .ctrl {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid #1e2530;
      margin-top: 12px;
    }
    .ctrl .danger { background: #5a2030; color: #ffd0d8; }
    .ctrl .accent { background: var(--real); color: #fff; }
    .footer {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      padding: 8px 0 4px;
    }
    .manual {
      width: 100%;
      background: var(--card);
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
      display: none;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .manual.show { display: flex; }
    .manual label { font-size: 14px; color: var(--muted); }
    .manual input {
      width: 72px;
      background: #0c0f14;
      border: 1px solid #2a3340;
      color: var(--emph);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 16px;
    }
    .cfg-warn {
      background: #3a2a20;
      color: #f0c090;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3a9;
      margin-right: 6px;
    }
    .status-dot.err { background: #c44; }
    .sync-hint {
      font-size: 12px;
      color: var(--muted);
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div id="cfgWarn" class="cfg-warn" style="display:none">
    尚未配置 Supabase。请在 common.js 填入配置，并执行 schema.sql（含 game_state 表）。
  </div>

  <div class="top">
    <div>
      <div class="brand-line">第 5 组 ·《德意志意识形态》第一章</div>
      <div class="title">词句审判庭 · 实时看板</div>
    </div>
    <div class="participants">
      已参与
      <strong id="partCount" data-value="0">0</strong>
      人
    </div>
  </div>

  <div class="session-bar">
    <span>场次</span>
    <input id="sessionInput" type="text" maxlength="40" />
    <button type="button" class="primary" id="sessionBtn">切换并广播</button>
    <span class="sync-hint">手机自动跟此场次 / 当前题</span>
    <span id="pollStatus" style="margin-left:auto;color:var(--muted);font-size:13px">
      <span class="status-dot" id="dot"></span>轮询中…
    </span>
  </div>

  <div class="q-nav" id="qNav"></div>

  <div class="main">
    <div class="stem" id="stem"></div>
    <div class="source" id="source"></div>

    <div class="bars">
      <div class="col word">
        <div class="col-label">词句</div>
        <div class="count" id="wordCount" data-value="0">0</div>
        <div class="track"><div class="fill" id="wordFill"></div></div>
      </div>
      <div class="col real">
        <div class="col-label">现实</div>
        <div class="count" id="realCount" data-value="0">0</div>
        <div class="track"><div class="fill" id="realFill"></div></div>
      </div>
    </div>

    <div class="reveal-panel" id="revealPanel">
      <div class="reveal-answer" id="revealAnswer"></div>
      <div class="reveal-rate" id="revealRate"></div>
    </div>
  </div>

  <div class="ctrl">
    <button type="button" id="btnPrev">上一题</button>
    <button type="button" id="btnNext">下一题</button>
    <button type="button" class="accent" id="btnReveal">揭晓</button>
    <button type="button" id="btnHideReveal">收起揭晓</button>
    <button type="button" id="btnManual">手动补票 ▾</button>
    <button type="button" id="btnRestart">重新开始</button>
    <button type="button" class="danger" id="btnClear">清空本场数据</button>
  </div>

  <div class="manual" id="manualPanel">
    <label>词句票数</label>
    <input id="manualWord" type="number" min="0" value="0" />
    <label>现实票数</label>
    <input id="manualReal" type="number" min="0" value="0" />
    <button type="button" id="manualApply">填入（覆盖本题统计）</button>
    <span style="font-size:12px;color:var(--muted)">举手统计兜底</span>
  </div>

  <div class="footer">第 5 组 ·《德意志意识形态》第一章 · 切题会同步到手机</div>

  <script type="module">
    import {
      QUESTIONS,
      LABEL,
      getLocalSession,
      setLocalSession,
      isConfigured,
      loadSupabase,
      tallyVotes,
      participantCount,
      animateNumber,
      fetchGameState,
      patchGameState,
    } from './common.js';

    const ANSWERS = {
      1: 'word',
      2: 'real',
      3: 'word',
      4: 'real',
      5: 'word',
      6: 'real',
    };

    const el = (id) => document.getElementById(id);
    let supabase = null;
    let session = getLocalSession();
    let currentQ = 1;
    let votesCache = [];
    let revealed = false;

    el('sessionInput').value = session;

    const qNav = el('qNav');
    QUESTIONS.forEach((q) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = String(q.q);
      b.dataset.q = String(q.q);
      b.addEventListener('click', () => setQuestion(q.q));
      qNav.appendChild(b);
    });

    async function broadcastState(extra = {}) {
      if (!supabase) return;
      try {
        await patchGameState(supabase, {
          session,
          current_q: currentQ,
          revealed,
          ...extra,
        });
      } catch (e) {
        console.error('广播状态失败', e);
        el('dot').classList.add('err');
        alert('同步到手机失败：请确认已执行最新 schema.sql（含 game_state 表）\n' + (e.message || e));
      }
    }

    function setQuestion(q, opts = {}) {
      const { keepReveal = false, skipBroadcast = false } = opts;
      currentQ = q;
      if (!keepReveal) {
        revealed = false;
        el('revealPanel').classList.remove('show');
      }
      qNav.querySelectorAll('button').forEach((b) => {
        b.classList.toggle('active', Number(b.dataset.q) === currentQ);
      });
      const item = QUESTIONS.find((x) => x.q === currentQ);
      el('stem').textContent = item.text;
      el('source').textContent = '出处：' + item.source;
      renderBars();
      if (revealed) showRevealUI();
      if (!skipBroadcast) broadcastState({ current_q: currentQ, revealed });
    }

    function renderBars() {
      const { word, real } = tallyVotes(votesCache, currentQ);
      const parts = participantCount(votesCache);
      animateNumber(el('wordCount'), word);
      animateNumber(el('realCount'), real);
      animateNumber(el('partCount'), parts);

      const max = Math.max(word, real, 1);
      el('wordFill').style.height = Math.round((word / max) * 100) + '%';
      el('realFill').style.height = Math.round((real / max) * 100) + '%';
    }

    function showRevealUI() {
      const ans = ANSWERS[currentQ];
      const { word, real, total } = tallyVotes(votesCache, currentQ);
      const correct = ans === 'word' ? word : real;
      const pct = total ? Math.round((correct / total) * 100) : 0;
      el('revealAnswer').textContent = '正确答案：' + LABEL[ans];
      el('revealRate').innerHTML =
        `本轮判对 ${correct} / ${total} 人（${pct}%）` +
        `<br><span>词句 ${word} · 现实 ${real}</span>`;
      el('revealPanel').classList.add('show');
      revealed = true;
    }

    async function showReveal() {
      showRevealUI();
      await broadcastState({ revealed: true });
    }

    async function hideReveal() {
      revealed = false;
      el('revealPanel').classList.remove('show');
      await broadcastState({ revealed: false });
    }

    async function fetchVotes() {
      if (!supabase) return;
      try {
        const { data, error } = await supabase
          .from('votes')
          .select('q,a,client_id')
          .eq('session', session);
        if (error) throw error;
        votesCache = data || [];
        el('dot').classList.remove('err');
        el('pollStatus').innerHTML =
          '<span class="status-dot" id="dot"></span>轮询中 · ' +
          new Date().toLocaleTimeString();
        renderBars();
        if (revealed) showRevealUI();
      } catch (e) {
        el('dot').classList.add('err');
        console.error(e);
      }
    }

    el('sessionBtn').addEventListener('click', async () => {
      const v =
        el('sessionInput').value.trim() ||
        new Date().toISOString().slice(0, 10);
      session = v;
      setLocalSession(v);
      el('sessionInput').value = v;
      revealed = false;
      el('revealPanel').classList.remove('show');
      currentQ = 1;
      setQuestion(1, { skipBroadcast: true });
      await broadcastState({
        session,
        current_q: 1,
        revealed: false,
      });
      await fetchVotes();
    });

    el('btnPrev').addEventListener('click', () => {
      setQuestion(currentQ <= 1 ? 6 : currentQ - 1);
    });
    el('btnNext').addEventListener('click', () => {
      setQuestion(currentQ >= 6 ? 1 : currentQ + 1);
    });
    el('btnReveal').addEventListener('click', showReveal);
    el('btnHideReveal').addEventListener('click', hideReveal);

    el('btnManual').addEventListener('click', () => {
      el('manualPanel').classList.toggle('show');
      const { word, real } = tallyVotes(votesCache, currentQ);
      el('manualWord').value = word;
      el('manualReal').value = real;
    });

    el('manualApply').addEventListener('click', async () => {
      if (!supabase) return alert('未配置数据库');
      const w = Math.max(0, parseInt(el('manualWord').value, 10) || 0);
      const r = Math.max(0, parseInt(el('manualReal').value, 10) || 0);
      if (!confirm(`将本题（第 ${currentQ} 题）票数覆盖为：词句 ${w} / 现实 ${r}？`)) return;

      try {
        const { error: delErr } = await supabase
          .from('votes')
          .delete()
          .eq('session', session)
          .eq('q', currentQ);
        if (delErr) throw delErr;

        const rows = [];
        for (let i = 0; i < w; i++) {
          rows.push({
            client_id: `manual_w_${currentQ}_${i}`,
            q: currentQ,
            a: 'word',
            session,
          });
        }
        for (let i = 0; i < r; i++) {
          rows.push({
            client_id: `manual_r_${currentQ}_${i}`,
            q: currentQ,
            a: 'real',
            session,
          });
        }
        if (rows.length) {
          const { error: insErr } = await supabase.from('votes').insert(rows);
          if (insErr) throw insErr;
        }
        await fetchVotes();
        alert('已填入');
      } catch (e) {
        console.error(e);
        alert('填入失败：' + (e.message || e));
      }
    });

    async function clearSessionVotes() {
      if (!supabase) return alert('未配置数据库');
      const { error } = await supabase.from('votes').delete().eq('session', session);
      if (error) throw error;
    }

    el('btnClear').addEventListener('click', async () => {
      if (!confirm(`确认清空场次「${session}」的全部投票数据？`)) return;
      if (!confirm('再次确认：清空后不可恢复。')) return;
      try {
        await clearSessionVotes();
        revealed = false;
        el('revealPanel').classList.remove('show');
        await broadcastState({ revealed: false });
        await fetchVotes();
      } catch (e) {
        alert('清空失败：' + (e.message || e));
      }
    });

    el('btnRestart').addEventListener('click', async () => {
      if (!confirm('重新开始：清空本场数据，回到第 1 题，并同步到手机？')) return;
      try {
        if (supabase) await clearSessionVotes();
      } catch (e) {
        alert('清空失败：' + (e.message || e));
        return;
      }
      revealed = false;
      el('revealPanel').classList.remove('show');
      setQuestion(1, { skipBroadcast: true });
      await broadcastState({ current_q: 1, revealed: false });
      await fetchVotes();
    });

    async function boot() {
      if (!isConfigured()) {
        el('cfgWarn').style.display = 'block';
        el('dot').classList.add('err');
        setQuestion(1, { skipBroadcast: true });
        return;
      }

      try {
        supabase = await loadSupabase();
      } catch (e) {
        el('cfgWarn').style.display = 'block';
        el('cfgWarn').textContent = '加载 Supabase SDK 失败，请检查网络。' + (e.message || '');
        el('dot').classList.add('err');
        setQuestion(1, { skipBroadcast: true });
        return;
      }

      // 启动时拉取云端状态，与上次课/其他设备对齐
      try {
        const st = await fetchGameState(supabase);
        if (st) {
          session = st.session || session;
          setLocalSession(session);
          el('sessionInput').value = session;
          currentQ = st.current_q || 1;
          revealed = !!st.revealed;
        } else {
          await broadcastState({
            session,
            current_q: 1,
            revealed: false,
          });
        }
      } catch (e) {
        console.warn(e);
        el('cfgWarn').style.display = 'block';
        el('cfgWarn').textContent =
          '读不到 game_state。请到 Supabase SQL Editor 重新执行仓库里的 schema.sql。';
      }

      setQuestion(currentQ, { keepReveal: revealed, skipBroadcast: true });
      if (revealed) showRevealUI();
      // 确保手机端能读到当前状态
      await broadcastState();
      await fetchVotes();
      setInterval(fetchVotes, 2000);
    }

    boot();
  </script>
</body>
</html>
