<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>词句审判庭 · 答题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1C1914;
      --card: #26211A;
      --word: #B94732;
      --real: #CAA765;
      --text: #E8E1D3;
      --muted: #8C8171;
      --border: #3A3227;
      --emph: #E8E1D3;
      --ok: #5A9A5A;
      --bad: #C44A3A;
      --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", STSong, serif;
      --sans: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(circle at 22% 28%, rgba(202, 167, 101, 0.055), transparent 52%),
        radial-gradient(circle at 78% 72%, rgba(185, 71, 50, 0.045), transparent 52%);
      box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.45);
    }
    body > * { position: relative; z-index: 1; }

    .eyebrow { font-size: 13px; color: var(--muted); letter-spacing: 0.04em; margin-bottom: 8px; }
    .brand {
      font-size: 20px; font-weight: 700; color: var(--emph);
      margin-bottom: 16px; font-family: var(--serif);
    }
    .rule {
      height: 1px;
      background: linear-gradient(90deg, transparent, #4A4033, transparent);
      margin-bottom: 14px;
    }
    .progress { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .progress strong { color: var(--emph); font-size: 14px; font-weight: 600; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .q-text {
      font-family: var(--serif);
      font-size: 22px;
      line-height: 1.7;
      font-weight: 600;
      color: var(--emph);
      margin-bottom: 20px;
      flex: 1;
    }
    .feedback {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
      min-height: 28px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .feedback.show { opacity: 1; }
    .feedback.ok { color: var(--ok); }
    .feedback.bad { color: var(--bad); }

    .options { display: flex; flex-direction: column; gap: 12px; }
    .opt {
      min-height: 64px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      padding: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      color: var(--text);
      transition: border-color 0.15s, background 0.15s, transform 0.15s;
      -webkit-user-select: none;
      user-select: none;
      font-family: var(--sans);
    }
    .opt:active { transform: scale(0.98); }
    .opt:disabled { cursor: default; }
    .opt .dot {
      width: 20px; height: 20px; border-radius: 50%;
      border: 1.5px solid #4A4033; flex: 0 0 auto; position: relative;
    }
    .opt.word .dot { border-color: var(--word); }
    .opt.real .dot { border-color: var(--real); }
    .opt .ot { font-size: 17px; font-weight: 600; color: var(--emph); display: block; }
    .opt .os { font-size: 12.5px; color: var(--muted); margin-top: 2px; display: block; }
    .opt .mark {
      margin-left: auto;
      font-size: 22px;
      font-weight: 700;
      width: 28px;
      text-align: center;
      opacity: 0;
    }
    .opt.correct {
      border-color: var(--ok);
      background: rgba(90, 154, 90, 0.14);
    }
    .opt.correct .mark { opacity: 1; color: var(--ok); }
    .opt.wrong {
      border-color: var(--bad);
      background: rgba(196, 74, 58, 0.14);
    }
    .opt.wrong .mark { opacity: 1; color: var(--bad); }
    .opt.dim { opacity: 0.45; }

    .gate, .done-head { text-align: center; padding: 28px 8px 8px; }
    .gate h2, .done-head h2 {
      font-family: var(--serif); font-size: 22px; margin-bottom: 12px; color: var(--emph);
    }
    .gate p { font-size: 15px; color: var(--muted); line-height: 1.65; }
    .score-big {
      font-size: 48px;
      font-weight: 700;
      color: var(--emph);
      line-height: 1.1;
      margin: 8px 0 6px;
      font-family: var(--sans);
    }
    .score-sub { font-size: 16px; color: var(--muted); margin-bottom: 18px; }

    .review {
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 2px;
      text-align: left;
    }
    .rev-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      background: #221E18;
    }
    .rev-item.ok { border-color: rgba(90, 154, 90, 0.45); }
    .rev-item.bad { border-color: rgba(196, 74, 58, 0.45); }
    .rev-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--muted);
    }
    .rev-badge {
      font-weight: 700;
      font-size: 14px;
    }
    .rev-badge.ok { color: var(--ok); }
    .rev-badge.bad { color: var(--bad); }
    .rev-q {
      font-family: var(--serif);
      font-size: 14px;
      line-height: 1.55;
      color: var(--emph);
      margin-bottom: 8px;
    }
    .rev-meta { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

    .start-btn {
      margin-top: 18px;
      min-height: 52px;
      padding: 0 28px;
      font-size: 17px;
      border: none;
      border-radius: 10px;
      background: var(--word);
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      font-family: var(--sans);
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: #2E2820;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 15px;
      max-width: 90%;
      z-index: 99;
      display: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      text-align: center;
    }
    .toast.show { display: block; }
    .toast button {
      margin-top: 10px; min-height: 40px; padding: 0 18px;
      border: none; border-radius: 8px; background: var(--word);
      color: #fff; font-size: 15px; cursor: pointer;
    }
    .hidden { display: none !important; }
    .cfg-warn {
      background: #3A2A20; color: #E8C090; border: 1px solid #5A4030;
      padding: 12px; border-radius: 8px; font-size: 14px;
      margin-bottom: 12px; line-height: 1.5;
    }

    .modal-mask {
      position: fixed; inset: 0; background: rgba(12, 10, 8, 0.78);
      z-index: 200; display: flex; align-items: center; justify-content: center;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
      animation: fadeIn 0.25s ease;
    }
    .modal-mask.closing { animation: fadeOut 0.2s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    .modal {
      width: 100%; max-width: 360px; background: var(--card);
      border: 1px solid var(--border); border-radius: 14px;
      padding: 24px 20px 20px; box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      animation: slideUp 0.28s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(16px); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal h2 {
      font-family: var(--serif); font-size: 20px; color: var(--emph);
      margin-bottom: 14px; text-align: center;
    }
    .modal .lead { font-size: 15px; color: var(--text); line-height: 1.65; margin-bottom: 14px; }
    .modal .tags { display: flex; gap: 8px; margin-bottom: 14px; }
    .modal .tag {
      flex: 1; text-align: center; padding: 10px 8px; border-radius: 8px;
      font-size: 14px; font-weight: 700; color: #fff;
    }
    .modal .tag.word { background: var(--word); }
    .modal .tag.real { background: var(--real); color: #1C1914; }
    .modal .tag small {
      display: block; font-size: 12px; font-weight: 500; opacity: 0.9; margin-top: 4px;
    }
    .modal .tips { font-size: 13px; color: var(--muted); line-height: 1.55; margin-bottom: 18px; }
    .modal .got-it {
      width: 100%; min-height: 52px; border: none; border-radius: 10px;
      background: var(--word); color: #fff; font-size: 17px; font-weight: 600;
      cursor: pointer; font-family: var(--sans);
    }
  </style>
</head>
<body>
  <div id="introMask" class="modal-mask" role="dialog" aria-modal="true" aria-labelledby="introTitle">
    <div class="modal">
      <h2 id="introTitle">你在投什么？</h2>
      <p class="lead">
        屏幕上会出现 <strong style="color:var(--emph)">六句话</strong>，都出自 1845 年德国那帮思想家。
        你要判断：这句话到底是在空谈概念，还是碰到了现实生活。
      </p>
      <div class="tags">
        <div class="tag word">词句<small>只换说法，没碰现实</small></div>
        <div class="tag real">现实<small>落到物质与生活</small></div>
      </div>
      <p class="tips">不记名 · 共 6 题 · 点完立刻看对错<br />答完有正确率与回顾。</p>
      <button type="button" class="got-it" id="gotItBtn">知道了</button>
    </div>
  </div>

  <div id="cfgWarn" class="cfg-warn hidden">尚未配置或无法连接数据库。</div>

  <div class="eyebrow">第 5 组 ·《德意志意识形态》第一章</div>
  <div class="brand">词句审判庭</div>

  <div id="gate" class="card gate">
    <div class="rule" style="margin:0 0 18px"></div>
    <h2>六道判断题</h2>
    <p>这句话是「只讲了词句」，还是「碰到了现实」？</p>
    <p style="margin-top:12px">点选项即提交 · 立刻显示对错</p>
    <button type="button" class="start-btn" id="howBtn" style="background:transparent;border:1px solid var(--border);color:var(--text);margin-top:12px;margin-bottom:0;font-weight:500;font-size:15px;min-height:44px">再看一遍说明</button>
    <button class="start-btn" id="startBtn" type="button">开始答题</button>
  </div>

  <div id="quiz" class="hidden" style="flex:1;flex-direction:column">
    <div class="rule"></div>
    <div class="progress">第 <strong id="qNum">1</strong> / 6 题 · <span id="qSource">P142–143</span></div>
    <div class="card">
      <div class="q-text" id="qText"></div>
      <div class="feedback" id="feedback"></div>
      <div class="options">
        <button type="button" class="opt word" data-a="word">
          <span class="dot"></span>
          <span style="flex:1">
            <span class="ot">词句</span>
            <span class="os">只换说法，没碰现实</span>
          </span>
          <span class="mark" aria-hidden="true"></span>
        </button>
        <button type="button" class="opt real" data-a="real">
          <span class="dot"></span>
          <span style="flex:1">
            <span class="ot">现实</span>
            <span class="os">落到物质与生活</span>
          </span>
          <span class="mark" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </div>

  <div id="done" class="card hidden" style="overflow:hidden">
    <div class="done-head">
      <div class="rule" style="margin:0 0 14px"></div>
      <h2>答题完成</h2>
      <div class="score-big" id="scoreBig">0 / 6</div>
      <div class="score-sub" id="scoreSub">正确率 0%</div>
      <p style="font-size:14px;color:var(--muted);margin-bottom:14px">请抬头看投影，一起总结。</p>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module">
    import {
      QUESTIONS,
      ANSWERS,
      LABEL,
      getClientId,
      isConfigured,
      upsertVote,
    } from './common.js';

    const el = (id) => document.getElementById(id);
    const toast = el('toast');
    let index = 0;
    let submitting = false;
    let pendingRetry = null;
    let ready = false;
    /** @type {{q:number,a:string,correct:boolean}[]} */
    let history = [];

    function showToast(msg, withRetry = false) {
      toast.innerHTML = '';
      const p = document.createElement('div');
      p.textContent = msg;
      toast.appendChild(p);
      if (withRetry && pendingRetry) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = '重试提交';
        btn.addEventListener('click', () => {
          toast.classList.remove('show');
          submitVote(pendingRetry);
        });
        toast.appendChild(btn);
      }
      toast.classList.add('show');
      clearTimeout(showToast._t);
      if (!withRetry) {
        showToast._t = setTimeout(() => toast.classList.remove('show'), 2800);
      }
    }

    function showOnly(id) {
      ['gate', 'quiz', 'done'].forEach((k) => {
        const node = el(k);
        if (k === id) {
          node.classList.remove('hidden');
          if (k === 'quiz' || k === 'done') node.style.display = 'flex';
        } else {
          node.classList.add('hidden');
        }
      });
    }

    function clearOptState() {
      const fb = el('feedback');
      fb.className = 'feedback';
      fb.textContent = '';
      document.querySelectorAll('.opt').forEach((btn) => {
        btn.disabled = false;
        btn.classList.remove('correct', 'wrong', 'dim');
        const mark = btn.querySelector('.mark');
        if (mark) mark.textContent = '';
      });
    }

    function renderQ() {
      const item = QUESTIONS[index];
      el('qNum').textContent = String(item.q);
      el('qSource').textContent = item.source;
      el('qText').textContent = item.text;
      clearOptState();
    }

    function showFeedback(picked, correctAns) {
      const ok = picked === correctAns;
      const fb = el('feedback');
      fb.textContent = ok ? '✓ 判断正确' : '✗ 判断有误';
      fb.className = 'feedback show ' + (ok ? 'ok' : 'bad');

      document.querySelectorAll('.opt').forEach((btn) => {
        const a = btn.dataset.a;
        const mark = btn.querySelector('.mark');
        if (a === correctAns) {
          btn.classList.add('correct');
          if (mark) mark.textContent = '✓';
        } else if (a === picked) {
          btn.classList.add('wrong');
          if (mark) mark.textContent = '✗';
        } else {
          btn.classList.add('dim');
        }
      });
      return ok;
    }

    function renderDone() {
      const correct = history.filter((h) => h.correct).length;
      const total = QUESTIONS.length;
      const pct = Math.round((correct / total) * 100);
      el('scoreBig').textContent = `${correct} / ${total}`;
      el('scoreSub').textContent = `正确率 ${pct}%`;

      const box = el('review');
      box.innerHTML = '';
      history.forEach((h) => {
        const q = QUESTIONS.find((x) => x.q === h.q);
        const item = document.createElement('div');
        item.className = 'rev-item ' + (h.correct ? 'ok' : 'bad');
        item.innerHTML =
          `<div class="rev-top">` +
          `<span>第 ${h.q} 题 · ${q.source}</span>` +
          `<span class="rev-badge ${h.correct ? 'ok' : 'bad'}">${h.correct ? '✓ 对' : '✗ 错'}</span>` +
          `</div>` +
          `<div class="rev-q">${q.text}</div>` +
          `<div class="rev-meta">你的选择：${LABEL[h.a]}　·　正确答案：${LABEL[ANSWERS[h.q]]}</div>`;
        box.appendChild(item);
      });
    }

    async function submitVote(a) {
      if (submitting) return;
      submitting = true;
      pendingRetry = a;
      const item = QUESTIONS[index];
      const correctAns = ANSWERS[item.q];
      const buttons = document.querySelectorAll('.opt');
      buttons.forEach((b) => { b.disabled = true; });

      try {
        if (!ready) throw new Error('未连接');
        await upsertVote({
          client_id: getClientId(),
          q: item.q,
          a,
        });

        const ok = showFeedback(a, correctAns);
        history.push({ q: item.q, a, correct: ok });
        pendingRetry = null;
        toast.classList.remove('show');

        await new Promise((r) => setTimeout(r, 1100));
        index += 1;
        submitting = false;
        if (index >= QUESTIONS.length) {
          renderDone();
          showOnly('done');
        } else {
          renderQ();
          showOnly('quiz');
        }
      } catch (e) {
        submitting = false;
        clearOptState();
        showToast('提交失败，请检查网络后重试', true);
        console.error(e);
      }
    }

    document.querySelectorAll('.opt').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (submitting) return;
        submitVote(btn.dataset.a);
      });
    });

    function closeIntro() {
      const mask = el('introMask');
      if (!mask || mask.classList.contains('hidden')) return;
      mask.classList.add('closing');
      setTimeout(() => {
        mask.classList.add('hidden');
        mask.classList.remove('closing');
      }, 180);
    }
    function openIntro() {
      el('introMask').classList.remove('hidden', 'closing');
    }

    el('gotItBtn').addEventListener('click', closeIntro);
    el('howBtn').addEventListener('click', openIntro);
    el('introMask').addEventListener('click', (e) => {
      if (e.target === el('introMask')) closeIntro();
    });

    el('startBtn').addEventListener('click', () => {
      closeIntro();
      index = 0;
      history = [];
      renderQ();
      showOnly('quiz');
    });

    function boot() {
      if (!isConfigured()) {
        el('cfgWarn').classList.remove('hidden');
        ready = false;
        return;
      }
      ready = true;
    }

    boot();
  </script>
</body>
</html>
