<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>词句审判庭 · 答题</title>
  <style>
    :root {
      --bg: #12161C;
      --card: #1C232C;
      --word: #A02A34;
      --real: #96702E;
      --text: #E8ECF2;
      --muted: #8B93A1;
      --emph: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      max-width: 480px;
      margin: 0 auto;
    }
    .eyebrow {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    .brand {
      font-size: 20px;
      font-weight: 700;
      color: var(--emph);
      margin-bottom: 12px;
    }
    .meta {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .progress {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .progress strong { color: var(--emph); font-size: 16px; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .q-text {
      font-size: 22px;
      line-height: 1.55;
      font-weight: 600;
      color: var(--emph);
      margin-bottom: 28px;
      flex: 1;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .opt {
      min-height: 56px;
      border: none;
      border-radius: 10px;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s ease, filter 0.15s ease, opacity 0.15s;
      -webkit-user-select: none;
      user-select: none;
    }
    .opt:active { transform: scale(0.98); }
    .opt:disabled { opacity: 0.55; cursor: default; }
    .opt.word { background: var(--word); }
    .opt.real { background: var(--real); }
    .opt.picked { filter: brightness(1.15); box-shadow: 0 0 0 2px #fff inset; }
    .opt .check { font-size: 18px; opacity: 0; }
    .opt.picked .check { opacity: 1; }

    .wait, .done, .gate {
      text-align: center;
      padding: 40px 12px;
    }
    .wait h2, .done h2, .gate h2 {
      font-size: 22px;
      margin-bottom: 12px;
      color: var(--emph);
    }
    .wait p, .done p, .gate p {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.6;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: #2a3140;
      color: #fff;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 15px;
      max-width: 90%;
      z-index: 99;
      display: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      text-align: center;
    }
    .toast.show { display: block; }
    .toast button {
      margin-top: 10px;
      min-height: 40px;
      padding: 0 18px;
      border: none;
      border-radius: 8px;
      background: var(--word);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    .hidden { display: none !important; }
    .cfg-warn {
      background: #3a2a20;
      color: #f0c090;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3a9;
      margin-right: 4px;
    }
    .dot.err { background: #c44; }
  </style>
</head>
<body>
  <div id="cfgWarn" class="cfg-warn hidden">
    尚未配置或无法连接。请讲者确认已执行 schema.sql。
  </div>

  <div class="eyebrow">第 5 组 ·《德意志意识形态》第一章</div>
  <div class="brand">词句审判庭</div>
  <div class="meta" id="metaLine">
    <span class="dot" id="syncDot"></span>同步中…
  </div>

  <div id="gate" class="card gate">
    <h2>等讲者开始</h2>
    <p>六道判断题：这句话是「只讲了词句」，还是「碰到了现实」？</p>
    <p style="margin-top:16px">不记名 · 讲者切题后自动出现<br />点选项即提交</p>
  </div>

  <div id="quiz" class="hidden" style="flex:1;flex-direction:column">
    <div class="progress">第 <strong id="qNum">1</strong> / 6 题</div>
    <div class="card">
      <div class="q-text" id="qText"></div>
      <div class="options">
        <button type="button" class="opt word" data-a="word">
          <span>词句</span><span class="check">✓</span>
        </button>
        <button type="button" class="opt real" data-a="real">
          <span>现实</span><span class="check">✓</span>
        </button>
      </div>
    </div>
  </div>

  <div id="wait" class="card wait hidden">
    <h2 id="waitTitle">已提交</h2>
    <p id="waitBody">等讲者切到下一题或揭晓。<br />请抬头看投影看板。</p>
  </div>

  <div id="done" class="card done hidden">
    <h2>六道题已全部作答</h2>
    <p>等讲者揭晓与收尾。<br />请抬头看投影看板。</p>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module">
    import {
      QUESTIONS,
      getClientId,
      setLocalSession,
      isConfigured,
      loadSupabase,
      fetchGameState,
    } from './common.js';

    const el = (id) => document.getElementById(id);
    const toast = el('toast');

    let supabase = null;
    let session = '';
    let currentQ = 1;
    let revealed = false;
    let submitting = false;
    let pendingRetry = null;
    /** 本客户端已答过的题号 */
    let answered = new Set();
    let lastStateKey = '';

    function showToast(msg, withRetry = false) {
      toast.innerHTML = '';
      const p = document.createElement('div');
      p.textContent = msg;
      toast.appendChild(p);
      if (withRetry && pendingRetry) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = '重试提交';
        btn.addEventListener('click', () => {
          toast.classList.remove('show');
          submitVote(pendingRetry);
        });
        toast.appendChild(btn);
      }
      toast.classList.add('show');
      clearTimeout(showToast._t);
      if (!withRetry) {
        showToast._t = setTimeout(() => toast.classList.remove('show'), 2800);
      }
    }

    function showOnly(id) {
      ['gate', 'quiz', 'wait', 'done'].forEach((k) => {
        const node = el(k);
        if (k === id) {
          node.classList.remove('hidden');
          if (k === 'quiz') node.style.display = 'flex';
        } else {
          node.classList.add('hidden');
        }
      });
    }

    function renderQuiz() {
      const item = QUESTIONS.find((x) => x.q === currentQ) || QUESTIONS[0];
      el('qNum').textContent = String(item.q);
      el('qText').textContent = item.text;
      document.querySelectorAll('.opt').forEach((btn) => {
        btn.disabled = false;
        btn.classList.remove('picked');
      });
    }

    function allDone() {
      return QUESTIONS.every((q) => answered.has(q.q));
    }

    function applyView() {
      el('metaLine').innerHTML =
        `<span class="dot" id="syncDot"></span>` +
        `场次 ${session || '…'} · 第 ${currentQ} 题` +
        (revealed ? ' · 已揭晓' : '');

      if (!session) {
        showOnly('gate');
        el('gate').querySelector('h2').textContent = '连接中…';
        return;
      }

      if (allDone()) {
        showOnly('done');
        return;
      }

      if (answered.has(currentQ)) {
        showOnly('wait');
        if (revealed) {
          el('waitTitle').textContent = '本题已揭晓';
          el('waitBody').innerHTML =
            '请看投影上的正确答案与判对率。<br />等讲者切到下一题。';
        } else {
          el('waitTitle').textContent = '已提交';
          el('waitBody').innerHTML =
            '等讲者切到下一题或揭晓。<br />请抬头看投影看板。';
        }
        return;
      }

      // 未答当前题 → 答题
      renderQuiz();
      showOnly('quiz');
    }

    async function refreshAnswered() {
      if (!supabase || !session) return;
      const { data, error } = await supabase
        .from('votes')
        .select('q')
        .eq('session', session)
        .eq('client_id', getClientId());
      if (error) throw error;
      answered = new Set((data || []).map((r) => r.q));
    }

    async function submitVote(a) {
      if (submitting || answered.has(currentQ)) return;
      submitting = true;
      pendingRetry = a;
      const buttons = document.querySelectorAll('.opt');
      buttons.forEach((b) => {
        b.disabled = true;
        if (b.dataset.a === a) b.classList.add('picked');
      });

      const payload = {
        client_id: getClientId(),
        q: currentQ,
        a,
        session,
      };

      try {
        if (!supabase) throw new Error('未连接');
        const { error } = await supabase.from('votes').upsert(payload, {
          onConflict: 'session,client_id,q',
        });
        if (error) throw error;

        await new Promise((r) => setTimeout(r, 400));
        answered.add(currentQ);
        pendingRetry = null;
        toast.classList.remove('show');
        submitting = false;
        applyView();
      } catch (e) {
        submitting = false;
        buttons.forEach((b) => {
          b.disabled = false;
          b.classList.remove('picked');
        });
        showToast('提交失败，请检查网络后重试', true);
        console.error(e);
      }
    }

    document.querySelectorAll('.opt').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (submitting) return;
        submitVote(btn.dataset.a);
      });
    });

    async function pollState() {
      if (!supabase) return;
      try {
        const st = await fetchGameState(supabase);
        if (!st) {
          el('syncDot')?.classList.add('err');
          showOnly('gate');
          el('gate').querySelector('h2').textContent = '等讲者打开看板';
          el('gate').querySelector('p').textContent =
            '讲者需先打开看板并执行含 game_state 的 schema.sql';
          return;
        }

        const nextSession = st.session;
        const nextQ = st.current_q;
        const nextRevealed = !!st.revealed;
        const key = `${nextSession}|${nextQ}|${nextRevealed}`;

        const sessionChanged = nextSession !== session;
        session = nextSession;
        setLocalSession(session);
        currentQ = nextQ;
        revealed = nextRevealed;

        if (sessionChanged) {
          await refreshAnswered();
        }

        // 状态变化或首次：刷新视图
        if (key !== lastStateKey) {
          lastStateKey = key;
          // 切场次/切题时拉取已答记录，避免重复答
          await refreshAnswered();
          applyView();
        }

        const dot = el('syncDot');
        if (dot) dot.classList.remove('err');
      } catch (e) {
        console.error(e);
        const dot = el('syncDot');
        if (dot) dot.classList.add('err');
      }
    }

    async function boot() {
      if (!isConfigured()) {
        el('cfgWarn').classList.remove('hidden');
        return;
      }
      try {
        supabase = await loadSupabase();
      } catch (e) {
        el('cfgWarn').classList.remove('hidden');
        el('cfgWarn').textContent = '加载失败，请换网络或用系统浏览器打开。';
        console.error(e);
        return;
      }
      await pollState();
      setInterval(pollState, 2000);
    }

    boot();
  </script>
</body>
</html>
